[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# 与 2020 年的链上字节码保持同一代 EVM：固定 solc 0.8.10 + istanbul
solc_version = "0.8.10"
evm_version = "istanbul"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = ["forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[profile.default.fuzz]
runs = 256
